<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <title>OPSQAI — Starting</title>
    <style>
      :root {
        --bg: #04211a;
        --fg: #f5f0e0;
        --muted: #a9bdb2;
        --gold: #c9a84c;
        --line: rgba(201, 168, 76, 0.20);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: var(--bg); color: var(--fg);
        font-family: "Segoe UI", "Space Grotesk", system-ui, -apple-system, sans-serif;
        overflow: hidden;
        -webkit-user-select: none; user-select: none;
      }
      main {
        height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 32px;
        text-align: center;
      }
      .mark { display: block; margin: 0 auto 18px; }
      .brand {
        font-size: 34px; font-weight: 600; letter-spacing: 0.02em;
        margin-bottom: 6px;
      }
      .brand span { color: var(--gold); }
      .tagline {
        color: var(--muted); font-size: 13px; margin-bottom: 40px;
      }
      .status {
        font-size: 14px; color: var(--fg);
        margin-bottom: 18px; min-height: 20px;
      }
      .bar {
        width: 320px; height: 4px; border-radius: 999px;
        background: var(--line); overflow: hidden; position: relative;
      }
      .bar::after {
        content: ""; position: absolute; inset: 0;
        width: 40%; background: linear-gradient(90deg, transparent, var(--gold), transparent);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
      .meta {
        margin-top: 22px; font-size: 11px; color: var(--muted);
        letter-spacing: 0.05em; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
        <g stroke="#C9A24C" fill="none">
          <polygon points="42.71,6.13 57.87,21.29 57.87,42.71 42.71,57.87 21.29,57.87 6.13,42.71 6.13,21.29 21.29,6.13" stroke-width="0.9"/>
          <polygon points="41.19,9.82 54.18,22.81 54.18,41.19 41.19,54.18 22.81,54.18 9.82,41.19 9.82,22.81 22.81,9.82" stroke-width="0.4" stroke-opacity="0.55"/>
        </g>
        <g fill="#C9A24C">
          <circle cx="40.43" cy="11.67" r="0.9"/><circle cx="52.33" cy="23.57" r="0.9"/>
          <circle cx="52.33" cy="40.43" r="0.9"/><circle cx="40.43" cy="52.33" r="0.9"/>
          <circle cx="23.57" cy="52.33" r="0.9"/><circle cx="11.67" cy="40.43" r="0.9"/>
          <circle cx="11.67" cy="23.57" r="0.9"/><circle cx="23.57" cy="11.67" r="0.9"/>
        </g>
        <text x="32" y="40.5" text-anchor="middle" font-family="Georgia,serif" font-weight="500" font-size="26" letter-spacing="-1.2" fill="#C9A24C">OQ</text>
      </svg>
      <div class="brand">OPS<span>QAI</span></div>
      <div class="tagline">Self-Hosted Platform</div>
      <div class="status" id="status">Starting OPSQAI…</div>
      <div class="bar" aria-hidden="true"></div>
      <div class="meta" id="meta"></div>
    </main>
    <script>
      const $status = document.getElementById("status");
      const $meta = document.getElementById("meta");
      if (window.opsqai) {
        window.opsqai.onStatus((text) => { $status.textContent = text; });
        window.opsqai.onProgress((p) => {
          if (!p) return;
          $meta.textContent = `Attempt ${p.attempt} · ${p.elapsed}s elapsed`;
        });
      }
    </script>
  </body>
</html>
