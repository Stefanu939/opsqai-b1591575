<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="OPSQAI Sovereign Mark">
  <title>OPSQAI Sovereign Mark</title>
  <defs>
    <linearGradient id="sm-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D78C"/>
      <stop offset="1" stop-color="#C9A24C"/>
    </linearGradient>
  </defs>
  <!-- ground -->
  <rect width="64" height="64" fill="#0A0A0A"/>
  <!-- outer octagonal cartouche -->
  <polygon points="42.71,6.13 57.87,21.29 57.87,42.71 42.71,57.87 21.29,57.87 6.13,42.71 6.13,21.29 21.29,6.13"
           fill="none" stroke="#C9A24C" stroke-width="0.6" stroke-opacity="0.95"/>
  <!-- inner gravure line -->
  <polygon points="41.19,9.82 54.18,22.81 54.18,41.19 41.19,54.18 22.81,54.18 9.82,41.19 9.82,22.81 22.81,9.82"
           fill="none" stroke="#C9A24C" stroke-width="0.25" stroke-opacity="0.55"/>
  <!-- 8 coronet nodes (network) -->
  <g fill="#C9A24C" fill-opacity="0.85">
    <circle cx="40.43" cy="11.67" r="0.7"/>
    <circle cx="52.33" cy="23.57" r="0.7"/>
    <circle cx="52.33" cy="40.43" r="0.7"/>
    <circle cx="40.43" cy="52.33" r="0.7"/>
    <circle cx="23.57" cy="52.33" r="0.7"/>
    <circle cx="11.67" cy="40.43" r="0.7"/>
    <circle cx="11.67" cy="23.57" r="0.7"/>
    <circle cx="23.57" cy="11.67" r="0.7"/>
  </g>
  <!-- monogram OQ, serif engraved -->
  <text x="32" y="40.5" text-anchor="middle"
        font-family="'Cormorant Garamond','Cormorant',Georgia,serif"
        font-weight="500" font-size="26" letter-spacing="-1.2"
        fill="url(#sm-gold)">OQ</text>
  <!-- gold accent: q descender -->
  <line x1="34.5" y1="42" x2="38" y2="46" stroke="url(#sm-gold)" stroke-width="0.8" stroke-linecap="round"/>
</svg>
