name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver, for example 1.0.0"
        required: true
      sign:
        description: "Sign with a configured Windows signing runner/cert"
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "win-v*"
    paths:
      - "opsqai-windows/**"
      - "src/**"
      - ".github/workflows/build-windows-installer.yml"

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed ($LASTEXITCODE)" }

      - name: Locate makensis and add to PATH
        shell: pwsh
        run: |
          $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles, 'C:\ProgramData\chocolatey')
          $exe = $null
          foreach ($r in $roots) {
            if ($r -and (Test-Path $r)) {
              $exe = Get-ChildItem -Path $r -Filter makensis.exe -Recurse -Depth 5 -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($exe) { break }
            }
          }
          if (-not $exe) { throw "makensis.exe not found after NSIS install" }
          Write-Host "Found makensis: $($exe.FullName)"
          & $exe.FullName /VERSION
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
          "OPSQAI_MAKENSIS=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          $ref = '${{ github.ref_name }}'
          if (-not $v -and $ref -match '^win-v(\d+\.\d+\.\d+)$') { $v = $Matches[1] }
          # NSIS VIProductVersion requires strict X.X.X (three numeric parts).
          if (-not ($v -match '^\d+\.\d+\.\d+$')) {
            $build = [int]$env:GITHUB_RUN_NUMBER
            $v = "0.1.$build"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $v"

      - name: Restore updater public key
        shell: pwsh
        working-directory: opsqai-windows
        env:
          OPSQAI_UPDATER_PUBKEY: ${{ secrets.OPSQAI_UPDATER_PUBKEY }}
        run: |
          if (-not $env:OPSQAI_UPDATER_PUBKEY) {
            Write-Warning "OPSQAI_UPDATER_PUBKEY is not configured; creating a Debug-only artifact."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path payload\updater | Out-Null
          $env:OPSQAI_UPDATER_PUBKEY | Set-Content -Path payload\updater\pubkey.pem -Encoding ascii

      - name: Build installer
        shell: pwsh
        working-directory: opsqai-windows
        run: |
          $config = 'Debug'
          if (Test-Path payload\updater\pubkey.pem) { $config = 'Release' }
          pwsh ./build/build.ps1 -Configuration $config -Version '${{ steps.ver.outputs.version }}'

      - name: Sign installer when requested
        if: ${{ inputs.sign == true }}
        shell: pwsh
        run: |
          signtool.exe sign /tr http://timestamp.digicert.com /td sha256 /fd sha256 /a opsqai-windows/build/artifacts/OPSQAI-Setup.exe
          signtool.exe verify /pa /v opsqai-windows/build/artifacts/OPSQAI-Setup.exe

      - name: Verify installer size
        shell: pwsh
        run: |
          $exe = 'opsqai-windows/build/artifacts/OPSQAI-Setup.exe'
          if (-not (Test-Path $exe)) { throw "Installer was not produced" }
          $size = (Get-Item $exe).Length
          if ($size -lt 50MB) { throw "Installer is too small ($([Math]::Round($size / 1MB, 1)) MB); refusing to upload stub" }

      - name: Compute installer SHA-256
        shell: pwsh
        run: |
          $exe = 'opsqai-windows/build/artifacts/OPSQAI-Setup.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  OPSQAI-Setup.exe" | Out-File -Encoding ascii -NoNewline "$exe.sha256"
          $sizeMb = [Math]::Round((Get-Item $exe).Length / 1MB, 1)
          @"
          ## OPSQAI-Setup.exe — v${{ steps.ver.outputs.version }}

          SHA-256 of the **.exe** (paste this into Management Center → Releases):

          ``````
          $hash
          ``````

          Size: $sizeMb MB
          "@ | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Write-Host "OPSQAI-Setup.exe SHA-256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPSQAI-Setup-${{ steps.ver.outputs.version }}
          path: |
            opsqai-windows/build/artifacts/OPSQAI-Setup.exe
            opsqai-windows/build/artifacts/OPSQAI-Setup.exe.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/win-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            opsqai-windows/build/artifacts/OPSQAI-Setup.exe
            opsqai-windows/build/artifacts/OPSQAI-Setup.exe.sha256

      - name: Send installer to Management Center (canary, needs approval)
        if: ${{ steps.ver.outputs.version != '' && env.OPSQAI_CI_TOKEN != '' }}
        env:
          OPSQAI_CI_TOKEN: ${{ secrets.OPSQAI_CI_TOKEN }}
          MC_URL: ${{ vars.OPSQAI_MC_URL || 'https://opsqai.de' }}
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $exe = 'opsqai-windows/build/artifacts/OPSQAI-Setup.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $h = @{ Authorization = "Bearer $env:OPSQAI_CI_TOKEN" }
          $api = "$env:MC_URL/api/public/v1/releases/ci"
          $start = Invoke-RestMethod -Method Post -Uri $api -Headers $h -ContentType 'application/json' -Body (@{ action='start'; version=$ver } | ConvertTo-Json)
          Invoke-WebRequest -Method Put -Uri $start.upload_url -InFile $exe -ContentType 'application/octet-stream' -UseBasicParsing | Out-Null
          $done = Invoke-RestMethod -Method Post -Uri $api -Headers $h -ContentType 'application/json' -Body (@{ action='finish'; version=$ver; sha256=$hash } | ConvertTo-Json)
          Write-Host "Management Center: v$ver saved as canary (id $($done.id)). Promote it in MC → Releases."
          "### Sent to Management Center`nv$ver is waiting in **MC → Releases** as *canary*. Press **Promote to stable** to release it." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
